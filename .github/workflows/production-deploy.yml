name: Production Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'

      # Required application secrets
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET != '' && secrets.NEXTAUTH_SECRET || secrets.AUTH_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      API_INTERNAL_SECRET: ${{ secrets.API_INTERNAL_SECRET }}
      PVP_GATEWAY_JWT_SECRET: ${{ secrets.PVP_GATEWAY_JWT_SECRET }}

      # Deployment secrets
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Optional production secrets
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      EMAIL_OTP_PEPPER: ${{ secrets.EMAIL_OTP_PEPPER }}
      AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
      AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}

      # Non-sensitive defaults
      NEXTAUTH_URL: 'https://type-ocean.vercel.app'
      SESSION_MAX_AGE: '2592000'
      LOG_LEVEL: 'info'
      DEBUG_SENSITIVE: 'false'
      SERVICE_NAME: 'type-ocean-production'
      REDIS_TLS: 'true'
      REDIS_PARALLEL: 'false'
      NEXT_PUBLIC_PVP_WS_URL: 'wss://type-ocean.vercel.app'
      PVP_ALLOWED_ORIGINS: 'https://type-ocean.vercel.app'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check required production secrets
        id: secrets_check
        run: |
          node -e "const req=['AUTH_SECRET','DATABASE_URL','API_INTERNAL_SECRET','PVP_GATEWAY_JWT_SECRET','VERCEL_TOKEN','VERCEL_ORG_ID','VERCEL_PROJECT_ID']; const missing=req.filter(k=>!process.env[k]||!String(process.env[k]).trim()); if(missing.length){console.log('deploy_ready=false'); console.log('missing='+missing.join(',')); process.exit(0)}; console.log('deploy_ready=true');" > .deploy_check
          Get-Content .deploy_check
          $ready = (Get-Content .deploy_check | Select-String '^deploy_ready=' | ForEach-Object { $_.ToString().Split('=')[1] })
          $missing = (Get-Content .deploy_check | Select-String '^missing=' | ForEach-Object { $_.ToString().Substring(8) })
          if ([string]::IsNullOrWhiteSpace($ready)) { $ready = 'false' }
          "deploy_ready=$ready" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($ready -ne 'true') {
            if (-not [string]::IsNullOrWhiteSpace($missing)) {
              "::warning::Skipping production deploy. Missing required secrets: $missing"
            } else {
              "::warning::Skipping production deploy. Required secrets are not configured."
            }
          } else {
            "Production secrets validation passed."
          }

      - name: Install dependencies
        if: steps.secrets_check.outputs.deploy_ready == 'true'
        run: npm ci

      - name: Drizzle generate
        if: steps.secrets_check.outputs.deploy_ready == 'true'
        run: npm run drizzle:generate

      - name: Build
        if: steps.secrets_check.outputs.deploy_ready == 'true'
        run: npm run build

      - name: Deploy to Vercel (Production)
        if: steps.secrets_check.outputs.deploy_ready == 'true'
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
