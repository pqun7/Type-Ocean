app = "type-space-pvp-gateway"
primary_region = "iad"

[build]
  dockerfile = "services/pvp-gateway/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  PVP_TRUST_PROXY_TLS = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"