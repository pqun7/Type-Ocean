version: '3.8'

services:
  # 🔹 خدمة قاعدة البيانات PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - compute_query_id=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # 🔹 خدمة Next.js
  app:
    build:
      context: .
    container_name: nextjs_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mydb}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
        ignore:
          - node_modules
      - action: rebuild
        path: package.json
        
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 1g

  # 🔹 خدمة Redis
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgdata:
